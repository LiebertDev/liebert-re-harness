[pytest]
# Repo-wide pytest configuration.
#
# The suite is split into two tiers so a fast regression baseline is actually
# runnable. Measured counts for this package and the engine setup the `heavy`
# tier needs are in docs/INSTALL.md.
#
#   fast (default)  -- no external analysis tool, pure/mocked, seconds each.
#   heavy            -- the tests that need a real external tool or corpus, or
#                        are slow. In this package that means the classes that
#                        run the real rizin, Detect It Easy, YARA-X, API
#                        Monitor, IDA and Ghidra installs (each probes for its tool and skips
#                        when it is absent), the real-corpus case validation in
#                        test_claim_index, the test modules that read corpus
#                        files this repository does not ship (skipped when
#                        absent), and one ~100 second pure-Python AES/LZSS
#                        unpacking test. The mocked wrapper tests, the
#                        Unicorn/Capstone vex tests and the frida_trace_client
#                        tests (no frida session or VM is started; ~25 s) run in
#                        the default tier. There are no angr or Hyper-V
#                        tests in this package, and no guest (VM) layer.
#
# `addopts` below excludes `heavy` by default; run it explicitly with
# `pytest -m heavy` (an explicit `-m` on the command line overrides this
# ini's `-m`, it does not stack with it).
testpaths = tests
markers =
    contract: error-path tests that pin the wrapper contract -- a call never raises, it returns an honest status; failures are classified correctly (missing tool, timeout, malformed output, refusal, environment error); an environment fault is never presented as a data fault. Selected by what they assert, not by importance. Stdlib exception behaviour differs between Python versions, so these must pass on every supported interpreter; the pre-push gate runs `-m contract` on each one it can find. They also run in the default tier unless that is narrowed
    heavy: tests that need a real external tool or unshipped corpus files, or are slow (real rizin/DIE/YARA-X/API Monitor/IDA installs, one long pure-Python test); excluded by default, run with `-m heavy`
addopts = -m "not heavy" -rs
