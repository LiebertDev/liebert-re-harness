[pytest]
# Repo-wide pytest configuration.
#
# The suite is split into two tiers so a fast regression baseline is actually
# runnable. Measured counts for this package and the engine setup the `heavy`
# tier needs are in docs/INSTALL.md.
#
#   fast (default)  -- no external analysis tool, pure/mocked, seconds each.
#   heavy            -- the slower or environment-dependent tests. In this
#                        package that means: the wrapper tests for rizin,
#                        Detect It Easy, YARA-X and API Monitor (many use mocks;
#                        those that need the real tool probe for it and skip
#                        when it is absent); Unicorn/Capstone emulation
#                        (vex.py); tests that read corpus files this repository
#                        does not ship (skipped when absent); the
#                        frida_trace_client tests (no frida session or VM is
#                        started); and one ~100 second pure-Python AES/LZSS
#                        unpacking test. There are no IDA, Ghidra, angr or
#                        Hyper-V tests in this package. Some can take minutes.
#
# `addopts` below excludes `heavy` by default; run it explicitly with
# `pytest -m heavy` (an explicit `-m` on the command line overrides this
# ini's `-m`, it does not stack with it).
testpaths = tests
markers =
    heavy: slow or environment-dependent tests (rizin/DIE/YARA-X/API Monitor wrappers, Unicorn emulation, unshipped corpus files, one long pure-Python test); excluded by default, run with `-m heavy`
addopts = -m "not heavy"
