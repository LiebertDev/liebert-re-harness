name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite must pass on a clean checkout with no external analysis engine
      # installed. Anything that needs one has to skip cleanly and say what is
      # missing -- CI is where that promise gets enforced.
      - name: Test
        run: pytest -q

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .

  no-binaries:
    name: no committed binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enforces docs/CORPUS.md mechanically rather than by review attention.
      # Test fixtures are built in code, so a real executable in the tree is
      # either an accident or something we cannot redistribute.
      - name: Reject executable samples
        run: |
          matches=$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -Ei '\.(exe|dll|sys|so|dylib|bin|elf|apk|dex|pdb|dmp|i64|idb)$' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Binary sample files must not be committed. See docs/CORPUS.md"
            echo "$matches"
            exit 1
          fi
          echo "No committed binaries."
