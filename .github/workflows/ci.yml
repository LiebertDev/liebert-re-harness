name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    # Linux is REPORTED, not yet REQUIRED, and the reason is two named defects
    # rather than vagueness: the workspace sandbox does not refuse an out-of-tree
    # destination on POSIX paths, and bounded_subprocess's process-tree teardown
    # leaves an orphaned grandchild alive. Tracked as issues #1 and #2; both are
    # real bugs in this package, not CI noise. Marking the leg non-blocking keeps
    # its result visible while it is being fixed, instead of either hiding it or
    # leaving the whole build permanently red. When both issues close, delete this.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite must pass on a clean checkout with no external analysis engine
      # installed. Anything that needs one has to skip cleanly and say what is
      # missing -- CI is where that promise gets enforced.
      - name: Test
        run: pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Rule selection lives in pyproject.toml's [tool.ruff.lint] and is scoped to
      # bug-finding rules (E9, F) rather than style; the reasoning is in that file.
      - run: ruff check .
      # `black --check` is deliberately NOT a gate. This code is written in a dense
      # one-line style throughout, so black would rewrite 35 files at once -- the
      # drive-by reformatting CONTRIBUTING.md asks contributors to avoid, and it
      # would bury every real diff. Adopting a formatter is welcome as its own pull
      # request: the formatting commit first, no behaviour change mixed into it.

  no-binaries:
    name: no committed binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enforces docs/CORPUS.md mechanically rather than by review attention.
      # Test fixtures are built in code, so a real executable in the tree is
      # either an accident or something we cannot redistribute.
      - name: Reject executable samples
        run: |
          matches=$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -Ei '\.(exe|dll|sys|so|dylib|bin|elf|apk|dex|pdb|dmp|i64|idb)$' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Binary sample files must not be committed. See docs/CORPUS.md"
            echo "$matches"
            exit 1
          fi
          echo "No committed binaries."
