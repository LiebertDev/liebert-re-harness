name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.14']
    # 3.14 is in the matrix because the local .venv is 3.14 and the pre-push gate runs on it, while CI
    # used to test only 3.10 and 3.12. That asymmetry was an accident, not a decision: a version the
    # local gate measures but CI does not invites "works on my machine" bugs, and the unicorn/faulthandler
    # behaviour found on 3.14 was exactly that kind. Do not add continue-on-error here.
    # Every leg is required. The Linux legs were briefly non-blocking while issues
    # #1 (POSIX path refusal) and #2 (POSIX process-group teardown) were open; both
    # are fixed and all legs pass, so the flag is gone as promised rather than
    # left behind to quietly excuse a future failure.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lattice]"

      # The suite must pass on a clean checkout with no external analysis engine
      # installed. Anything that needs one has to skip cleanly and say what is
      # missing -- CI is where that promise gets enforced.
      - name: Test
        run: pytest -q

      # Part of the default suite above (not marked heavy); run alone so a
      # discipline failure is named in its own step, not buried in the log.
      - name: Repo discipline gate
        run: pytest -q tests/test_repo_discipline.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Rule selection lives in pyproject.toml's [tool.ruff.lint] and is scoped to
      # bug-finding rules (E9, F) rather than style; the reasoning is in that file.
      - run: ruff check .
      # `black --check` is deliberately NOT a gate. This code is written in a dense
      # one-line style throughout, so black would rewrite the whole tree at once -- the
      # drive-by reformatting CONTRIBUTING.md asks contributors to avoid, and it
      # would bury every real diff. Adopting a formatter is welcome as its own pull
      # request: the formatting commit first, no behaviour change mixed into it.

  no-binaries:
    name: no committed binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enforces docs/CORPUS.md mechanically rather than by review attention.
      # Test fixtures are built in code, so a real executable in the tree is
      # either an accident or something we cannot redistribute.
      - name: Reject executable samples
        run: |
          matches=$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -Ei '\.(exe|dll|sys|so|dylib|bin|elf|apk|dex|pdb|dmp|i64|idb)$' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Binary sample files must not be committed. See docs/CORPUS.md"
            echo "$matches"
            exit 1
          fi
          echo "No committed binaries."

  package:
    name: package (wheel smoke import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Proves the built wheel, not the checkout, contains every module of the
      # liebert_re package. No editable install here: that would let the source tree
      # satisfy imports the wheel cannot.
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          (whl,) = glob.glob("dist/*.whl")
          bad = [n for n in zipfile.ZipFile(whl).namelist()
                 if not (n.startswith("liebert_re/") or n.split("/")[0].endswith(".dist-info"))]
          assert not bad, bad
          PY
      - name: Smoke-import every module of the installed package from outside the repo
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import importlib, os, pkgutil, sys
          import liebert_re
          repo = os.environ["GITHUB_WORKSPACE"]
          assert not any(os.path.abspath(p or ".") == repo for p in sys.path), sys.path
          mods = sorted(m.name for m in pkgutil.walk_packages(liebert_re.__path__, "liebert_re.") if not m.ispkg)
          # Deliberate count: what the wheel ships cannot change without a
          # reviewed edit here. 70 = 68 library modules + cli + __main__.
          # (+1 over 66: liebert_re/tools/capa.py, the capa wrapper.)
          # (+1 over 67: liebert_re/tools/ida.py, the IDA wrapper. Its IDAPython worker is a
          # data file under ida_scripts/ and is checked below, not imported.)
          # (+1 over 68: liebert_re/tools/pe_sieve.py, the pe-sieve wrapper.)
          # (+1 over 69: liebert_re/dynamic/lab_gate.py, the dynamic-lab gate.)
          assert len(mods) == 70, (len(mods), mods)
          failed = []
          import importlib.resources as _res
          worker = _res.files("liebert_re.tools").joinpath("ida_scripts/query_program.idapy")
          assert worker.is_file(), "the IDAPython worker is missing from the wheel"
          microcode_worker = _res.files("liebert_re.tools").joinpath("ida_scripts/microcode_cfg.idapy")
          assert microcode_worker.is_file(), "the IDAPython microcode worker is missing from the wheel"
          patch_plan_worker = _res.files("liebert_re.tools").joinpath("ida_scripts/patch_plan.idapy")
          assert patch_plan_worker.is_file(), "the IDAPython patch-plan worker is missing from the wheel"
          for m in mods:
              try:
                  mod = importlib.import_module(m)
                  assert os.path.abspath(mod.__file__).startswith(os.path.abspath(sys.prefix)), mod.__file__
              except BaseException as e:
                  failed.append(f"{m}: {type(e).__name__}: {e}")
          print(f"imported {len(mods) - len(failed)}/{len(mods)}")
          if failed:
              print(chr(10).join(failed))
              sys.exit(1)
          PY
