[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liebert-re-harness"
version = "0.1.0"
description = "Reverse-engineering analysis modules and crackme solution write-ups."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "pefile",
    "capstone",
    "unicorn",
    "numpy",
    "dncil",
    "dnfile",
    "ijson",
    "keystone-engine",
    "psutil",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]
# frida_trace_client.py is the only module that needs it, and it is a client for
# an isolated-VM tracing setup rather than something the core analysis path uses.
# Kept out of the required set so a plain install stays small and platform-portable.
frida = ["frida"]
# tools_lattice.py / lll_exact.py need it for high-precision Gram-Schmidt. tools_lattice
# fails closed with a structured TOOL_MISSING result when it is absent, so it is
# an extra rather than a required dependency. CI installs it so those tests run.
lattice = ["mpmath"]

[project.urls]
Homepage = "https://github.com/LiebertDev/liebert-re-harness"
Issues = "https://github.com/LiebertDev/liebert-re-harness/issues"

# pytest configuration deliberately lives in pytest.ini, not here. A pytest.ini
# present in the same tree silently WINS over [tool.pytest.ini_options], so
# having both would mean one of them is quietly ignored -- exactly the kind of
# silent-wrong-answer this project is organised against. One source only.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Scoped to the rules that find BUGS, not the ones that find style.
#
# Ruff's wider default set reports 481 findings here, and 469 of them are E701 /
# E702 -- the dense `if not x: return y` one-line style this codebase is written
# in throughout. "Fixing" those would mean reformatting 35 files wholesale, which
# is precisely the drive-by reformatting CONTRIBUTING.md tells contributors not to
# do, and it would bury every real diff for a year. The style is not the problem.
#
# So: E9 (syntax and IO errors) and F (Pyflakes -- undefined names, unused
# imports, redefinitions, unused locals). Those 12 findings were real and were
# fixed rather than ignored. This gate stays honest because it can actually fail:
# an undefined name in a new contribution will stop CI.
#
# Widening this list is welcome as its own pull request, one rule family at a
# time, with the reformatting kept separate from any behavioural change.
select = ["E9", "F"]

[tool.setuptools]
py-modules = [
    "analysis_findings",
    "analysis_ir",
    "asar_parser",
    "binary_version_diff",
    "bounded_subprocess",
    "claim_guard",
    "claim_index",
    "codeview_rsds",
    "constant_at_address_verifier",
    "cross_binary_relationships",
    "dotnet_il",
    "dotnet_relationships",
    "evidence_index",
    "evidence_security",
    "exploit_validation",
    "frida_trace_client",
    "lll_exact",
    "lzma1_range_decoder",
    "minidump_structural",
    "msf_pdb",
    "native_pdb_toolchain",
    "pe_address",
    "process_lock",
    "tools_apimonitor",
    "tools_binary",
    "tools_crypto_id",
    "tools_die",
    "tools_formats",
    "tools_lattice",
    "tools_rizin",
    "tools_vb6_pcode",
    "tools_workspace",
    "tools_yara_x",
    "vex",
    "workspace_index",
]
